[package]
name = "forge-ui"
version = "0.1.0"
edition = "2021"
description = "A small Rust desktop GUI framework with an owned layout and software rendering engine"
publish = false
license = "BUSL-1.1"

[features]
default = ["nedb"]
nedb = ["dep:nedb-engine", "dep:fs2"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nedb-engine = { version = "=2.8.6", optional = true }
fs2 = { version = "0.4", optional = true }

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = ["nedb"]
