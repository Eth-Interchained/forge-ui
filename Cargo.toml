[package]
name = "forge-ui"
version = "0.1.0"
edition = "2021"
description = "A small Rust desktop GUI framework with an owned layout and software rendering engine"
publish = ["crates-io"]
license = "BUSL-1.1"
readme = "README.md"
repository = "https://github.com/Eth-Interchained/forge-ui"
homepage = "https://eth-interchained.github.io/forge-ui/"
documentation = "https://eth-interchained.github.io/forge-ui/api/forge_ui/"
keywords = ["gui", "desktop", "agents", "widgets", "nedb"]
categories = ["gui"]
include = [
    "src/**", "assets/**", "examples/*.rs", "tests/**",
    "Cargo.toml", "Cargo.lock", "README.md", "AGENTS.md",
    "LICENSE", "COPYING-GPL-3.0.txt", "THIRD_PARTY.md", "third-party/**",
    "docs/guide.md", "docs/protocol.schema.json", "docs/llms.txt",
    "tools/agent_client.py", "tools/live_test.py",
]

[features]
default = ["nedb"]
nedb = ["dep:nedb-engine", "dep:fs2"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nedb-engine = { version = "=2.8.6", optional = true }
fs2 = { version = "0.4", optional = true }

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = ["nedb"]
